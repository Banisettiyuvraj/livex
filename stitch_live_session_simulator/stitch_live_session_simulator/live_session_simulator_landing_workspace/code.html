<!DOCTYPE html>

<html class="h-full bg-[#121212] select-none" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Session Simulator</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {

            sans: ['Inter', 'sans-serif'],

<!-- BEGIN: Custom Styles -->
<style data-purpose="canvas-background">
    /* Subtle infinite dot grid resembling Excalidraw's canvas */
    .dot-grid-canvas {
      background-color: #121212;
      background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: 0 0;
    }
  </style>
<style data-purpose="ui-interactions">
    /* Subtle transitions and tactile button states */
    .tool-btn {
      transition: all 0.15s ease-in-out;
    }
    .tool-btn:hover {
      background-color: #2c2c2c;
      color: #ffffff;
    }
    .tool-btn:active {
      transform: scale(0.96);
    }
    /* Corner brackets for the minimalist dropzone */
    .bracket-tl {
      position: absolute; top: -12px; left: -12px; width: 14px; height: 14px;
      border-top: 1.5px solid #3a3a3e; border-left: 1.5px solid #3a3a3e;
    }
    .bracket-tr {
      position: absolute; top: -12px; right: -12px; width: 14px; height: 14px;
      border-top: 1.5px solid #3a3a3e; border-right: 1.5px solid #3a3a3e;
    }
    .bracket-bl {
      position: absolute; bottom: -12px; left: -12px; width: 14px; height: 14px;
      border-bottom: 1.5px solid #3a3a3e; border-left: 1.5px solid #3a3a3e;
    }
    .bracket-br {
      position: absolute; bottom: -12px; right: -12px; width: 14px; height: 14px;
      border-bottom: 1.5px solid #3a3a3e; border-right: 1.5px solid #3a3a3e;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="h-full w-full overflow-hidden text-neutral-200 antialiased dot-grid-canvas relative font-sans flex flex-col justify-between">
<!-- BEGIN: CanvasDropzoneOverlay -->
<!-- Invisible global drag & drop receiver -->
<div class="absolute inset-0 z-0 pointer-events-auto" data-purpose="global-drag-listener" id="drop-target"></div>
<!-- END: CanvasDropzoneOverlay -->
<!-- BEGIN: TopBarLayout -->
<header class="relative z-20 w-full px-4 pt-3 pointer-events-none flex items-start justify-between">
<!-- Top-Left Branding & Menu -->
<div class="flex items-center gap-2 pointer-events-auto" data-purpose="top-left-menu">
<button aria-label="Application Menu" class="h-9 w-9 flex items-center justify-center rounded-lg bg-surface border border-border text-neutral-300 tool-btn shadow-sm focus:outline-none focus:ring-1 focus:ring-accent-purple" title="Menu" type="button">
<!-- Excalidraw hamburger icon -->
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewbox="0 0 24 24">
<line x1="3" x2="21" y1="6" y2="6"></line>
<line x1="3" x2="21" y1="12" y2="12"></line>
<line x1="3" x2="21" y1="18" y2="18"></line>
</svg>
</button>
<div class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-surface/80 backdrop-blur-sm border border-border/80 text-xs shadow-sm">

<button class="tool-btn w-8 h-8 rounded-lg flex items-center justify-center text-neutral-400" title="Simulator Settings" type="button">

<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
<!-- Overflow Menu -->

<circle cx="12" cy="12" r="1"></circle>
<circle cx="19" cy="12" r="1"></circle>

</nav>
<!-- Invisible balancing spacer -->

<!-- BEGIN: MainCanvasCenter -->

<div class="relative flex flex-col items-center text-center max-w-lg transition-transform duration-200" data-purpose="dropzone-center-indicator" id="center-zone">

<div aria-hidden="true" class="bracket-tl"></div>
<div aria-hidden="true" class="bracket-tr"></div>
<div aria-hidden="true" class="bracket-bl"></div>
<div aria-hidden="true" class="bracket-br"></div>

<!-- Primary Canvas Message -->

<div class="flex items-center gap-1.5 text-sm text-muted-txt mb-6 font-normal">

<button class="pointer-events-auto inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-surface border border-border text-neutral-200 hover:text-white hover:border-neutral-500 text-xs font-medium transition-colors" onclick="document.getElementById('hidden-file-input').click()" type="button">
<span>Open Video</span>
<kbd class="font-mono text-[10px] text-neutral-400 bg-neutral-800 px-1 rounded">⌘O</kbd>
</button>

<span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500/80"></span>

<!-- BEGIN: InteractiveScriptHandlers -->
<script data-purpose="drag-drop-interactivity">
    // Minimal interaction script handling drag visual feedback and file triggers
    const dropArea = document.getElementById('drop-target');
    const centerZone = document.getElementById('center-zone');
    const openBtn = document.getElementById('open-video-btn');
    const fileInput = document.getElementById('hidden-file-input');

    // Trigger file dialog
    openBtn.addEventListener('click', () => fileInput.click());

    // Keyboard shortcut ⌘O / Ctrl+O handler
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'o') {
        e.preventDefault();
        fileInput.click();
      }
    });

    // Drag-over visual feedback on the canvas
    ['dragenter', 'dragover'].forEach(eventName => {
      window.addEventListener(eventName, (e) => {
        e.preventDefault();
        centerZone.classList.add('scale-105');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      window.addEventListener(eventName, (e) => {
        e.preventDefault();
        centerZone.classList.remove('scale-105');
      }, false);
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        console.log('Video loaded into session:', files[0].name);
      }
    });
  </script>
<!-- END: InteractiveScriptHandlers -->
</body></html>
